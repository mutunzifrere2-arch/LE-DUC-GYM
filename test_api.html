<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Connection</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test de Connexion API</h1>
    <p>Cette page teste la connexion à votre serveur Flask.</p>

    <button onclick="testConnection()">Tester la Connexion</button>
    <button onclick="testLogin()">Tester le Login</button>

    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(message, isSuccess = true) {
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        async function testConnection() {
            try {
                console.log('Testing connection to /api/check-auth...');
                const response = await fetch('/api/check-auth');
                const data = await response.json();
                console.log('Response:', data);
                addResult(`✅ Connexion réussie: ${JSON.stringify(data)}`, true);
            } catch (error) {
                console.error('Connection failed:', error);
                addResult(`❌ Erreur de connexion: ${error.message}`, false);
            }
        }

        async function testLogin() {
            try {
                console.log('Testing login...');
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'admin123' })
                });
                const data = await response.json();
                console.log('Login response:', data);
                addResult(`✅ Login réussi: ${JSON.stringify(data)}`, true);
            } catch (error) {
                console.error('Login failed:', error);
                addResult(`❌ Erreur login: ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
